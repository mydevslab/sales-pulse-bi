services:
postgres_dw:
image: postgres:15-alpine
container_name: nexa_sales_dw
restart: always
environment:
POSTGRES_DB: nexa_dw
POSTGRES_USER: dw_admin
POSTGRES_PASSWORD: dw_secure_password123
ports:
  - "5433:5432"
volumes:
  - postgres_data:/var/lib/postgresql/data
  - ./sql/ddl:/docker-entrypoint-initdb.d
postgres_data:
healthcheck:
test: [ "CMD-SHELL", "pg_isready -U dw_admin -d nexa_dw" ]
interval: 10s
timeout: 5s
retries: 5,
