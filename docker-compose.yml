version: '3.8'

services:
postgres_dw:
image: postgres:15-alpine
container_name: nexa_sales_dw
restart: always
environment:
POSTGRES_DB: ${DB_NAME:-nexa_dw}
POSTGRES_USER: ${DB_USER:-dw_admin}
POSTGRES_PASSWORD: ${DB_PASS:-dw_secure_password123}
ports:
  - "${DB_PORT:-5432}:5432"
volumes:
  - postgres_data:/var/lib/postgresql/data
  - ./sql/ddl:/docker-entrypoint-initdb.d
healthcheck:
test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-dw_admin} -d${DB_NAME:-nexa_dw}" ]
interval: 10s
timeout: 5s
retries: 5
postgres_data:
